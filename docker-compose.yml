version: '3.8'

services:
  localstack:
    image: localstack/localstack:2.0.2
    container_name: localstack-rds
    ports:
      - "4566:4566"
      - "5432:5432"
    environment:
      SERVICES: rds
      DEBUG: 1
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

networks:
  default:
    name: localstack-network
